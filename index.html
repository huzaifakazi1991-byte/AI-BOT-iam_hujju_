    <script>
      (function () {
        if (window.__VITE_WS_GUARD__) return;
        window.__VITE_WS_GUARD__ = true;
        var NativeWS = window.WebSocket;
        function GuardedWebSocket(url, protocols) {
          var urlStr = String(url || '');
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          var isViteHmr =
            protoStr.indexOf('vite-hmr') !== -1 ||
            protoStr.indexOf('vite-ping') !== -1 ||
            urlStr.indexOf(':24678') !== -1 ||
            urlStr.indexOf('__vite_ping') !== -1 ||
            (urlStr.indexOf('/live') === -1 && protoStr.length > 0 && protoStr.indexOf('vite') !== -1);

          if (!isViteHmr) {
            return protocols !== undefined
              ? new NativeWS(url, protocols)
              : new NativeWS(url);
          }

          var target = new EventTarget();
          var stub = Object.create(target);
          stub.url = urlStr;
          stub.protocol = protoStr;
          stub.readyState = 1;
          stub.bufferedAmount = 0;
          stub.extensions = '';
          stub.binaryType = 'blob';
          stub.CONNECTING = 0;
          stub.OPEN = 1;
          stub.CLOSING = 2;
          stub.CLOSED = 3;
          stub.send = function () {};
          stub.close = function () {
            stub.readyState = 3;
          };
          stub.addEventListener = target.addEventListener.bind(target);
          stub.removeEventListener = target.removeEventListener.bind(target);
          stub.dispatchEvent = target.dispatchEvent.bind(target);

          setTimeout(function () {
            var openEvt = new Event('open');
            if (typeof stub.onopen === 'function') stub.onopen(openEvt);
            stub.dispatchEvent(openEvt);

            var msgEvt = new MessageEvent('message', {
              data: JSON.stringify({ type: 'connected' }),
            });
            if (typeof stub.onmessage === 'function') stub.onmessage(msgEvt);
            stub.dispatchEvent(msgEvt);
          }, 0);

          return stub;
        }
        GuardedWebSocket.prototype = NativeWS.prototype;
        GuardedWebSocket.CONNECTING = NativeWS.CONNECTING;
        GuardedWebSocket.OPEN = NativeWS.OPEN;
        GuardedWebSocket.CLOSING = NativeWS.CLOSING;
        GuardedWebSocket.CLOSED = NativeWS.CLOSED;
        window.WebSocket = GuardedWebSocket;
      })();
    </script>
